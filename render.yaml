services:
  - type: web
    name: truthdare
    runtime: python
    plan: free
    rootDir: web
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: test -n "$DATABASE_URL_UNPOOLED" && DATABASE_URL="$DATABASE_URL_UNPOOLED" python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CLOUDINARY_URL
        sync: false
