<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10090e">
    <title>Offline · Truth or Dare Arcade</title>
    <link rel="stylesheet" href="/static/games/style.css">
</head>
<body>
    <main class="page-shell home-shell">
        <section class="chat-panel">
            <div class="chat-topbar"><span class="live-dot"></span><span>ARCADE CONNECTION LOST</span></div>
            <div class="chat-feed">
                <div class="message-row">
                    <div class="avatar avatar-bot" aria-label="Game bot">🤖</div>
                    <div class="message-stack">
                        <span class="message-author">THE GAME MASTER</span>
                        <div class="bubble bubble-system">Looks like you’re offline. Reconnect to keep playing.</div>
                        <a class="button button-pink" href="/">Try again</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
